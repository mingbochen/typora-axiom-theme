<svg xmlns="http://www.w3.org/2000/svg" width="800" height="176" viewBox="0 0 800 176" role="img" aria-labelledby="title desc">
  <title id="title">请求处理流程</title>
  <desc id="desc">输入请求经过 Prefill 建立 KV Cache，再由 Decode 生成输出。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#737373" stroke-width="1.4"/></marker></defs>
  <rect x="0.5" y="0.5" width="799" height="175" rx="12" fill="#f9f9f9" stroke="#e5e5e7"/>
  <g fill="#fff" stroke="#d4d4d8"><rect x="24" y="46" width="142" height="68" rx="10"/><rect x="224" y="46" width="142" height="68" rx="10"/><rect x="424" y="46" width="142" height="68" rx="10"/><rect x="624" y="46" width="152" height="68" rx="10"/></g>
  <g stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"><path d="M176 80h36"/><path d="M376 80h36"/><path d="M576 80h36"/></g>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle"><g fill="#242424" font-size="16" font-weight="600"><text x="95" y="75">输入请求</text><text x="295" y="75">Prefill</text><text x="495" y="75">KV Cache</text><text x="700" y="75">Decode</text></g><g fill="#616161" font-size="12"><text x="95" y="98">Prompt tokens</text><text x="295" y="98">处理输入序列</text><text x="495" y="98">保存中间结果</text><text x="700" y="98">逐个生成 token</text><text x="400" y="148">用一条清晰的数据流，理解一个复杂的系统。</text></g></g>
</svg>
